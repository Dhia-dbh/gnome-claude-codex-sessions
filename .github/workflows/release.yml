# Builds a release when a version tag (v1.2.3) is pushed for a commit on main: checks the tag matches
# version-name in metadata.json, packs the extension zip and publishes it as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is on main and matches metadata.json
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version=$(jq -r '."version-name"' metadata.json)
          [ "v$version" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME but metadata.json version-name is $version"; exit 1; }

      - name: Build the extension zip
        run: |
          sudo apt-get install -y --no-install-recommends libglib2.0-bin zip
          glib-compile-schemas schemas
          uuid=$(jq -r .uuid metadata.json)
          zip -r "$uuid.shell-extension.zip" metadata.json extension.js prefs.js stylesheet.css \
            schemas bin install.sh LICENSE README.md
          echo "ZIP=$uuid.shell-extension.zip" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Claude Sessions $GITHUB_REF_NAME" --generate-notes --verify-tag
